
env: 
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        key: AWS_ACCESS_KEY_ID
        name: aws-creds
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: AWS_SECRET_ACCESS_KEY
        name: aws-creds
  - name: AWS_REGION
    value: ap-south-1

tolerations:
    key: app
    operator: Equal
    value: shopstack

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
    
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_shopstack_*.log
        multiline.parser docker, cri
        Tag shopstack.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

  filters: |
    [FILTER]
        Name kubernetes
        Match shopstack.*
        Merge_Log On
        Keep_Log Off
        Labels On
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off
        Annotations Off

    [FILTER]
        Name lua
        Match shopstack.*
        code function extract_service_name(tag, timestamp, record) if record["kubernetes"] ~= nil and record["kubernetes"]["pod_name"] ~= nil then local pod_name = record["kubernetes"]["pod_name"]; local service_name = string.match(pod_name, "^(.+)%-[a-z0-9]+-[a-z0-9]+$"); if service_name ~= nil then record["service_name"] = service_name else record["service_name"] = pod_name end end; return 2, timestamp, record end
        call extract_service_name

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match shopstack.*
        region ap-south-1
        log_group_name /aws/kops/k8s/shopstack/
        log_stream_prefix $(service_name)
        auto_create_group true

# [OUTPUT]
#     Name s3
#     Match shopstack.*
#     bucket shopstack-preprod-k8s
#     region ap-south-1
#     total_file_size 50M
#     use_put_object Off
#     compression gzip
#     s3_key_format /logs/%Y/%m/%d/%H_%M_%S.gz
  
  
  customParsers: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L


