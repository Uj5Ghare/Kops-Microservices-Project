# Change the fleet.token and fleet.ca.value as per your fleet server configuration
outputs:
  default:
    type: ESPlainAuthBasic
    url: "https://<domain>:9200"
    username: "elastic"
    password: "<password>"
    secretName: "elastic-agent"
    name: "elastic-agent" 
    namespace: "monitor"

kubernetes:
  enabled: true
  output: default
  namespace: "monitor"
  hints:
    enabled: false
  state:
    enabled: true
    agentAsSidecar:
      enabled: false
      resources:
        limits:
          memory: 800Mi
        requests:
          cpu: 100m
          memory: 400Mi
    host: "kube-state-metrics:8080"
  metrics:
    enabled: true
  apiserver:
    enabled: true
  proxy:
    enabled: false
  containers:
    metrics:
      enabled: true
    state:
      enabled: true
    logs:
      enabled: true
    audit_logs:
      enabled: false
  pods:
    metrics:
      enabled: true
    state:
      enabled: true
  deployments:
    state:
      enabled: true
  statefulsets:
    state:
      enabled: true
  daemonsets:
    state:
      enabled: true
  replicasets:
    state:
      enabled: true
  namespaces:
    state:
      enabled: true
  volumes:
    metrics:
      enabled: true
  nodes:
    metrics:
      enabled: true
    state:
      enabled: true
  storageclasses:
    state:
      enabled: true
  jobs:
    state:
      enabled: true
  cronjobs:
    state:
      enabled: true
  persistentvolumes:
    state:
      enabled: true
  persistentvolumeclaims:
    state:
      enabled: true
  resourcequotas:
    state:
      enabled: true
  services:
    state:
      enabled: true
  system:
    metrics:
      enabled: true

system:
  enabled: false
  output: default
  namespace: monitor
  authLogs:
    enabled: true
  syslog:
    enabled: true
  metrics:
    enabled: true

