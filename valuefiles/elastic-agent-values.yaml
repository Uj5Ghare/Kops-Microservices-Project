  presets:
    perNode:
      mode: daemonset
      serviceAccount:
        create: true
      clusterRole:
        create: true
      hostNetwork: true
      resources:
        limits:
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 400Mi
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        key: app
        operator: Equal
        value: shopstack
      statePersistence: HostPath
      extraEnvs:
        - name: ELASTIC_NETINFO
          value: "false"
      agent:
        monitoring:
          namespace: monitor
          use_output: default
          enabled: true
          logs: true
          metrics: true
      providers:
        kubernetes:
          node: ${NODE_NAME}
          scope: node

kube-state-metrics:
  enabled: true
  fullnameOverride: "kube-state-metrics"
  replicas: 1
  tolerations:
    key: app
    operator: Equal
    value: shopstack
