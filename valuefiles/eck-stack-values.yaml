---
eck-elasticsearch:
  enabled: true
  fullnameOverride: elasticsearch
  nodeSets:
  - name: elk
    count: 1
    # Comment out when setting the vm.max_map_count via initContainer, as these are mutually exclusive.
    # For production workloads, it is strongly recommended to increase the kernel setting vm.max_map_count to 262144
    # and leave node.store.allow_mmap unset.
    # ref: https://www.elastic.co/guide/en/cloud-on-k8s/master/k8s-virtual-memory.html
    config:
      node.store.allow_mmap: false
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
    podTemplate:
      spec:
        tolerations:
          key: app
          operator: Equal
          value: shopstack
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "app"
                      operator: "In"
                      values:
                        - "shopstack"
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1

eck-kibana:
  enabled: true
  fullnameOverride: kibana
  elasticsearchRef:
    name: elasticsearch
  spec:
    http:
      service:
        spec:
          type: NodePort
          # Optionally specify a nodePort (must be in range 30000-32767)
          # If not specified, Kubernetes will auto-assign one
          # ports:
          # - port: 5601
          #   nodePort: 30561
    podTemplate:
      spec:
        tolerations:
          key: app
          operator: Equal
          value: shopstack
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "app"
                      operator: "In"
                      values:
                        - "shopstack"

  config:
    server:
      publicBaseUrl: "https://observability.theshopstack.com"
    # Note that these are specific to the namespace into which this example is installed, and are
    # using `elastic-stack` as configured here and detailed in the README when installing:
    #
    # `helm install es-kb-quickstart elastic/eck-stack -n elastic-stack`
    #
    # If installed outside of the `elastic-stack` namespace, the following 2 lines need modification.
    xpack.fleet.agents.elasticsearch.hosts: ["https://elasticsearch-es-http.monitor.svc:9200"]
    xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server-agent-http.monitor.svc:8220"]
    xpack.fleet.packages:
    - name: system
      version: latest
    - name: elastic_agent
      version: latest
    - name: fleet_server
      version: latest
    - name: kubernetes
      version: latest
    xpack.fleet.agentPolicies:
    - name: Fleet Server on ECK policy
      id: eck-fleet-server
      namespace: monitor
      is_managed: true
      monitoring_enabled:
      - logs
      - metrics
      package_policies:
      - name: fleet_server-1
        id: fleet_server-1
        package:
          name: fleet_server
    - name: Elastic Agent on ECK policy
      id: eck-agent
      namespace: monitor
      is_managed: true
      monitoring_enabled:
      - logs
      - metrics
      unenroll_timeout: 900
      package_policies:
      - package:
          name: system
        name: system-1
      - package:
          name: kubernetes
        name: kubernetes-1
        id: kubernetes-1
        inputs:
        - type: logfile
          enabled: true
          streams:
          - data_stream:
              dataset: kubernetes.container_logs
              type: logs
            vars:
            - name: paths
              value:
              - /var/log/containers/shopstack*.log
            - name: symlinks
              value: true

eck-agent:
  enabled: false
  policyID: eck-agent
  kibanaRef:
    name: kibana
  elasticsearchRefs: []
  fleetServerRef:
    name: fleet-server
  mode: fleet
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: elastic-agent
        hostNetwork: true
        hostPID: true
        dnsPolicy: ClusterFirstWithHostNet
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory
          - name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory
          - name: varlibcontainerd
            hostPath:
              path: /var/lib/containerd
              type: DirectoryOrCreate
        containers:
          - name: agent
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: varlibcontainerd
                mountPath: /var/lib/containerd
                readOnly: true
        tolerations:
          key: app
          operator: Equal
          value: shopstack
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "app"
                      operator: "In"
                      values:
                        - "shopstack"
  
eck-fleet-server:
  enabled: false
  fullnameOverride: "fleet-server"
  deployment:
    replicas: 1
    podTemplate:
      spec:
        serviceAccountName: fleet-server
        automountServiceAccountToken: true
        tolerations:
          key: app
          operator: Equal
          value: shopstack
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "app"
                      operator: "In"
                      values:
                        - "shopstack"
  # Agent policy to be used.
  policyID: eck-fleet-server
  kibanaRef:
    name: kibana
  elasticsearchRefs:
  - name: elasticsearch


eck-apm-server:
  enabled: false
  fullnameOverride: apm-server
  version: 9.2.0
  count: 1
  elasticsearchRef:
    name: elasticsearch
    namespace: monitor
  kibanaRef:
    name: kibana
    namespace: monitor
  http:
    service:
      spec:
        type: NodePort
        # ports:
        # - port: 8200
        #   nodePort: 30200
    tls:
      selfSignedCertificate:
        disabled: false
  
  # APM Server configuration
  config:
    # Output configuration (managed by elasticsearchRef)
    # apm-server:
    #   rum:
    #     enabled: true
    #     event_rate.limit: 300
    #     event_rate.lru_size: 1000
    #     allow_origins: ['*']
    #     library_pattern: "node_modules|bower_components|~"
    #     exclude_from_grouping: "^/webpack"
    #   kibana:
    #     enabled: true
    #     host: "kibana-kb-http.monitor.svc:5601"
    
  # Pod template configuration
  podTemplate:
    spec:
      # Tolerations to schedule on your nodes
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "shopstack"
      - key: "app"
        operator: "Equal"
        value: "shopstack"
      - key: "app"
        operator: "Equal"
        value: "shopstack"
      - key: "app"
        operator: "Equal"
        value: "shopstack"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "app"
                    operator: "In"
                    values:
                      - "shopstack"
      
      # Resource limits
      containers:
      - name: apm-server
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 500m

# If enabled, will use the eck-logstash chart and deploy a Logstash resource.
eck-logstash:
  enabled: false