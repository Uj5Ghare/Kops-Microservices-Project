apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.defaults.labels }}
  labels:
    {{- include "cart.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.statefulSet.serviceName }}
  podManagementPolicy: {{ .Values.statefulSet.podManagementPolicy }}
  replicas: 1
  updateStrategy:
    {{- toYaml .Values.statefulSet.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Values.defaults.labels }}
  template:
    metadata:
      annotations:
        {{- include "cart.annotations" . | nindent 8 }}
    spec:
      tolerations:
        - key: app
          operator: Equal
          value: shopstack-dbs
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - shopstack
      containers:
        - name: {{ .Chart.Name }}
          image: "ghcr.io/shopstack/shopstack-mysql:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: "cities"
            - name: MYSQL_USER
              value: "shipping"
            - name: MYSQL_PASSWORD
              value: "secret"
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
              cpu: "200m"
          volumeMounts:
            {{- range .Values.statefulSet.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      restartPolicy: Always
  volumeClaimTemplates:
    {{- range .Values.statefulSet.volumeClaimTemplates }}
    - metadata:
        name: {{ .name }}
      spec:
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .resources.requests.storage }}
        {{- if .storageClassName }}
        storageClassName: {{ .storageClassName }}
        {{- end }}
    {{- end }}
