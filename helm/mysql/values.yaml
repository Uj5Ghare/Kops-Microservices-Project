defaults:
  namespace:
    name: shopstack
    enabled: false
  labels: mysql
  managedBy: Helm
  annotations:
    lang: mysql

# DEPLOYMENT CONFIGURATION
deploy:
  replicaCount: 1
  image:
    repository: ghcr.io/shopstack/shopstack-mysql
    tag: ${IMAGE_TAG}
    pullPolicy: IfNotPresent
  affinity:
    nodeAffinity:
      key: app
      operator: In
      values: shopstack
  strategy:
    type: RollingUpdate
    maxSurge: 50%
    maxUnavailable: 0
  resources:
    requests:
      memory: "200Mi" 
      cpu: "100m"
    limits:
      memory: "500Mi"
      cpu: "200m"
  restartPolicy: Always
  readinessProbe:
    enabled: true
    path: /
    scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    path: /
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  tolerations:
    key: app
    operator: Equal
    value: shopstack
  env:
    - name: MYSQL_ALLOW_EMPTY_PASSWORD
      value: "yes"
    - name: MYSQL_DATABASE
      value: "cities"
    - name: MYSQL_USER
      value: "shipping"
    - name: MYSQL_PASSWORD
      value: "secret"

# SERVICE CONFIGURATION
service:
  type: ClusterIP
  ports:
    http:
      name: http
      protocol: TCP
      port: 3306
      targetPort: 3306

# INGRESS CONFIGURATION
ingress:
  enabled: false
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: mysql.shopstack.local
  path: /
  pathType: Prefix

# HORIZONTAL POD AUTOSCALER CONFIGURATION
hpa:
  enabled: true
  maxReplicas: 3
  minReplicas: 1
  cpu:
    metrics:
      resourceName: cpu
      averageUtilization: 70
      type: Utilization
  behavior:
    scaleDown:
      policies:
        periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Min
      stabilizationWindowSeconds: 180
    scaleUp:
      policies:
        periodSeconds: 15
        type: Percent
        value: 30
      selectPolicy: Min
      stabilizationWindowSeconds: 500

# SECRET CONFIGURATION
secret:
  enabled: false
  name: mysql-secret
  type: Opaque
  data: ""

# POD DISRUPTION BUDGET CONFIGURATION
pdb:
  enabled: true
  minAvailable: 1

# SECRET PROVIDER CLASS CONFIGURATION
spc:
  provider: aws
  region: ap-south-1
  objects:
    MYSQL_ALLOW_EMPTY_PASSWORD: MYSQL_ALLOW_EMPTY_PASSWORD
    MYSQL_DATABASE: MYSQL_DATABASE
    MYSQL_USER: MYSQL_USER
    MYSQL_PASSWORD: MYSQL_PASSWORD

configMap:
  enabled: false
