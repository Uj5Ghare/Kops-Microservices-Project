apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.defaults.labels }}
spec:
  provider: {{ .Values.spc.provider }}
  parameters:
    region: {{ .Values.spc.region }}
    objects: |  
      - objectName: {{ .Values.defaults.labels }}-preprod
        objectType: secretsmanager
        jmesPath:
          - path: INSTANA_AUTO_PROFILE
            objectAlias: INSTANA_AUTO_PROFILE
          - path: REDIS_HOST
            objectAlias: REDIS_HOST
          - path: CATALOGUE_HOST
            objectAlias: CATALOGUE_HOST
          - path: CART_SERVER_PORT
            objectAlias: CART_SERVER_PORT
  secretObjects:
    - secretName: {{ .Values.defaults.labels }}-preprod
      type: Opaque
      data:
        - objectName: INSTANA_AUTO_PROFILE
          key: INSTANA_AUTO_PROFILE
        - objectName: REDIS_HOST
          key: REDIS_HOST
        - objectName: CATALOGUE_HOST
          key: CATALOGUE_HOST
        - objectName: CART_SERVER_PORT
          key: CART_SERVER_PORT
