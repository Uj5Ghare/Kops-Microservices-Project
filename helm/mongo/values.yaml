defaults:
  namespace:
    name: shopstack
    enabled: false
  labels: mongo
  managedBy: Helm
  annotations:
    lang: mongo

# STATEFULSET CONFIGURATION
statefulSet:
  serviceName: mongo
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  volumeClaimTemplates:
    - name: data
      accessModes:
        - "ReadWriteOnce"
      resources:
        requests:
          storage: 1Gi
      storageClassName: ""
  volumeMounts:
    - name: data
      mountPath: /data/db

# SERVICE CONFIGURATION
service:
  type: ClusterIP
  ports:
    http:
      name: http
      protocol: TCP
      port: 27017
      targetPort: 27017

# INGRESS CONFIGURATION
ingress:
  enabled: false
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: mongo.shopstack.local
  path: /
  pathType: Prefix

# HORIZONTAL POD AUTOSCALER CONFIGURATION
hpa:
  enabled: true
  maxReplicas: 3
  minReplicas: 1
  cpu:
    metrics:
      resourceName: cpu
      averageUtilization: 70
      type: Utilization
  behavior:
    scaleDown:
      policies:
        periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Min
      stabilizationWindowSeconds: 180
    scaleUp:
      policies:
        periodSeconds: 15
        type: Percent
        value: 30
      selectPolicy: Min
      stabilizationWindowSeconds: 500

# SECRET CONFIGURATION
secret:
  enabled: false
  name: mongo-secret
  type: Opaque
  data: ""

# POD DISRUPTION BUDGET CONFIGURATION
pdb:
  enabled: true
  minAvailable: 1

# SECRET PROVIDER CLASS CONFIGURATION
spc:
  provider: aws
  region: ap-south-1
  objects:
    MONGO_INITDB_DATABASE: MONGO_INITDB_DATABASE

configMap:
  enabled: false
