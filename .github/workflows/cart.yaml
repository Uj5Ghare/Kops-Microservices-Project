# ==============================================================
# Shopstack - DevSecOps CI/CD Pipeline
# ==============================================================

name: Shopstack DevSecOps Pipeline

on:
  push:
    branches:
      - env/prod
      - env/preprod
      - env/staging
    paths:
      - "cart/**"
      - ".github/workflows/cart.yaml"
  pull_request:
    branches:
      - env/prod
      - env/preprod
      - env/staging
    paths:
      - "cart/**"
      - ".github/workflows/cart.yaml"

# Security: restrict default permissions to read-only
permissions:
  contents: read

jobs:
  build:
    name: "🐳 Build ${{ matrix.component }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR
    strategy:
      matrix:
        component: [cart]
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopstack-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Security: provenance and SBOM
          provenance: true
          sbom: true
